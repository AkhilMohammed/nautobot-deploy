name: Build + Deploy Nautobot Combined Image & Provision

on:
  push:
    paths:
      - 'ansible/inventories/prod/group_vars/nautobot.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_REPO: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/nautobot-demo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Install yq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Build & Push Combined Image to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          COMBINED_IMAGE="${IMAGE_REPO}:${{ github.sha }}"
          echo "Building combined image → $COMBINED_IMAGE"
          
          bash scripts/build_combined_image.sh \
            "$COMBINED_IMAGE" \
            "ansible/inventories/prod/group_vars/nautobot.yml" \
            "$DOCKERHUB_USERNAME" \
            "$DOCKERHUB_TOKEN"

          docker tag "$COMBINED_IMAGE" "${IMAGE_REPO}:latest"

          echo "$DOCKERHUB_TOKEN" | docker login \
            -u "$DOCKERHUB_USERNAME" --password-stdin

          docker push "$COMBINED_IMAGE"
          docker push "${IMAGE_REPO}:latest"

      - name: Set image for next steps
        id: set_image
        run: echo "image=${{ env.IMAGE_REPO }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Terraform Init
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          terraform apply -auto-approve \
            -var="ssh_key_name=${{ secrets.AWS_SSH_KEY_NAME }}" \
            -var="ami_id=${{ secrets.AMI_ID }}" \
            -var="aws_region=${{ secrets.AWS_REGION }}"

      - name: Fetch Public IP from Terraform
        working-directory: terraform
        id: tf_out
        run: |
          terraform output -raw instance_public_ip > ../instance_ip.txt
          echo "ip=$(cat ../instance_ip.txt)" >> $GITHUB_OUTPUT

      - name: Create Dynamic Inventory
        run: |
          mkdir -p ansible
          echo "[nautobot_servers]" > inventory.ini
          echo "${{ steps.tf_out.outputs.ip }} ansible_user=ubuntu" >> inventory.ini

      - name: Deploy Nautobot on EC2 (Ansible)
        uses: dawidd6/action-ansible-playbook@v2
        with:
          playbook: playbooks/deploy.yml
          inventory: inventory.ini
          options: >-
            -e "combined_image=${{ env.IMAGE_REPO }}:${{ github.sha }}"

        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
